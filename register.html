<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EYESON — Create Account</title>
  <meta name="description" content="Create your EYESON account."/>
  <link rel="icon" href="images/logo/logo.png"/>
  <link rel="stylesheet" href="css/theme.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/header.css"/>
  <link rel="stylesheet" href="css/footer.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/pages.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
</head>
<body data-page="register">
  <div id="header"></div>
  <div class="auth-wrap">
    <div class="auth-card">
      <span class="logo-dual auth-logo">
        <img class="lg-black" src="images/logo/logo-black.png" alt="EYESON" onerror="this.parentElement.innerHTML='<span class=&quot;logo-fallback&quot;>EYESON</span>'"/>
        <img class="lg-white" src="images/logo/logo-white.png" alt=""/>
      </span>
      <h2 class="headline-md" style="font-size:1.6rem">JOIN THE VISION</h2>
      <p class="text-soft">Create your EYESON account.</p>

      <div id="regStep1">
        <p class="auth-step">Step <strong>1</strong> of 2 — Details</p>
        <form id="regDetailsForm">
          <div class="field"><label for="regUsername">Username</label><input type="text" id="regUsername" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" autocomplete="username" placeholder="your_username"/></div>
          <div class="field"><label for="regName">Full Name <span class="text-soft">(optional)</span></label><input type="text" id="regName" maxlength="80" autocomplete="name" placeholder="Your name"/></div>
          <div class="field"><label for="regEmail">Email</label><input type="email" id="regEmail" required autocomplete="email" placeholder="you@example.com"/></div>
          <div class="field"><label for="regPassword">Password</label><input type="password" id="regPassword" required minlength="10" autocomplete="new-password" placeholder="At least 10 characters"/></div>
          <div class="field"><label for="regConfirmPassword">Confirm Password</label><input type="password" id="regConfirmPassword" required minlength="10" autocomplete="new-password" placeholder="Repeat your password"/></div>
          <label class="text-soft" style="display:flex;gap:9px;align-items:center;margin:5px 0 18px;cursor:pointer"><input type="checkbox" id="regRemember" checked/> Remember this device</label>
          <button class="btn btn-solid" type="submit" style="width:100%" id="regSendBtn">Create Account &amp; Send Code</button>
        </form>
      </div>

      <div id="regStep2" style="display:none">
        <p class="auth-step">Step <strong>2</strong> of 2 — Verify email</p>
        <button class="auth-back" type="button" id="regBack">← Back</button>
        <p class="otp-email-hint">Enter the 6-digit code sent to <strong id="regEmailDisplay"></strong></p>
        <div class="otp-inputs" id="regOtpBox" aria-label="Six digit verification code">
          <input class="otp-input" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-label="Digit 1"/>
          <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2"/>
          <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3"/>
          <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4"/>
          <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5"/>
          <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6"/>
        </div>
        <div class="otp-error" id="regOtpError"></div>
        <div class="otp-actions">
          <button class="btn btn-solid" type="button" id="regVerifyBtn">Verify &amp; Create Account</button>
          <button class="resend-link" type="button" id="regResend">Resend Code</button>
        </div>
      </div>

      <p class="auth-alt">Already have an account? <a id="loginLink" href="login.html">Sign in</a></p>
    </div>
  </div>
  <div id="footer"></div>
  <script src="js/auth-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/search.js"></script>
  <script src="js/loading.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/carousel.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
